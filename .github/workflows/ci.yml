# PR과 main 푸시마다 백엔드 테스트 + 프론트 빌드를 돌린다.
# mvn verify 한 번이 프론트 빌드(frontend-maven-plugin) → 백엔드 테스트(Testcontainers MySQL) → jar 패키징까지 한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: npm 캐시
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}

      # Docker Hub 가 가끔 500 으로 이미지를 못 내려 주어 Testcontainers 가 실패한다.
      # 테스트 전에 필요한 이미지를 먼저 받고, 실패하면 몇 번 다시 시도한다(끝내 못 받아도 여기서는 멈추지 않는다).
      - name: Testcontainers 이미지 미리 받기
        run: |
          for image in mysql:8.0 testcontainers/ryuk:0.14.0; do
            for attempt in 1 2 3 4; do
              if docker pull "$image"; then break; fi
              echo "::warning::$image 받기 실패 ($attempt/4)"
              sleep $((attempt * 10))
            done
          done

      - name: 테스트 + 프론트 빌드
        run: ./mvnw -B verify
