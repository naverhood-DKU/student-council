# PR과 main 푸시마다 백엔드 테스트 + 프론트 빌드를 돌린다.
# mvn verify 한 번이 프론트 빌드(frontend-maven-plugin) → 백엔드 테스트(Testcontainers MySQL) → jar 패키징까지 한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: npm 캐시
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: 테스트 + 프론트 빌드
        run: ./mvnw -B verify
