# 모든 프로필 공통 설정.
# 프로필: local(개발) / prod(NCP) / worker(비동기 작업) / fake-ai(AI 고정 응답)
# 예) 로컬 App:    --spring.profiles.active=local
#     로컬 Worker: --spring.profiles.active=local,worker
spring:
  application:
    name: council-flow
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. JPA는 엔티티와 테이블이 맞는지만 확인한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # PDF 회의록·규정 업로드 한도
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: council-flow
    ttl: 15m
  seed:
    enabled: false
  worker:
    # job 테이블 폴링. worker 프로필(운영)과 local 프로필에서 켠다.
    enabled: false
    poll-interval: 1s
    # 임대 유효시간. 처리 중 lease/3마다 연장하며, Worker 중단 후에는 마지막 임대 만료까지 기다린다.
    lease: 10m
    max-attempts: 3
    retry-delay: 30s
  ai:
    # real: CLOVA 실제 호출 / fake: 고정 응답 (fake-ai 프로필에서 바뀜)
    mode: real
  clova:
    studio:
      # 키는 환경변수로만 받는다. 비어 있으면 분석 작업이 AI_KEY_MISSING 으로 실패한다.
      api-key: ${CLOVA_STUDIO_API_KEY:}
      model: HCX-007
      connect-timeout: 5s
      read-timeout: 240s
      max-completion-tokens: 8192
  analysis:
    # 회의록이 이보다 길면 발언 ID를 유지한 채 구간으로 나눠 분석하고 합친다.
    chunk-chars: 12000

logging:
  # 모든 로그 줄에 requestId(API)와 jobId(작업)를 붙인다. 회의 원문·키는 로그에 남기지 않는다.
  pattern:
    level: "%5p [rid:%X{requestId:-} job:%X{jobId:-}]"
