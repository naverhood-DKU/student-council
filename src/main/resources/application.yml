# 모든 프로필 공통 설정.
# 프로필: local(개발) / prod(NCP) / worker(비동기 작업) / fake-ai(AI 고정 응답)
# 예) 로컬 App:    --spring.profiles.active=local
#     로컬 Worker: --spring.profiles.active=local,worker
spring:
  application:
    name: council-flow
  datasource:
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      data-source-properties:
        connectTimeout: 5000
        socketTimeout: 5000
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 바꾼다. JPA는 엔티티와 테이블이 맞는지만 확인한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # PDF 회의록·규정 업로드 한도
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: council-flow
    ttl: 15m
  seed:
    enabled: false
  rules:
    # 학교 규정(resources/rules/*.json)을 모든 그룹이 쓰는 공통 규정으로 앱이 뜰 때 넣는다. 개정은 json 을 바꿔 새로 배포한다.
    seed:
      enabled: true
    # 회의 분석이 끝나면 돈과 관련된 업무 카드를 규정에서 자동으로 확인한다(후보 조항 찾기 + AI 안내 작업).
    auto-check:
      enabled: true
      # 회의 하나에서 자동으로 확인하는 업무 카드의 최대 수(AI 호출 비용을 묶어 둔다)
      max-per-meeting: 15
  worker:
    # job 테이블 폴링. worker 프로필(운영)과 local 프로필에서 켠다.
    enabled: false
    poll-interval: 1s
    # 심박이 AI 호출 및 한도 대기와 별개로 갱신한다. 만료 임대는 재사용하지 않는다.
    lease: 90s
    heartbeat-interval: 15s
    max-attempts: 3
    retry-delay: 30s
  ai:
    # real: CLOVA 실제 호출 / fake: 고정 응답 (fake-ai 프로필에서 바뀜)
    mode: real
  speech:
    # 녹음 전사. fake: "(데모 전사)" 고정 문장(기본) / clova: CLOVA Speech 실제 호출(prod 기본, 로컬은 .env 에 SPEECH_MODE=clova)
    mode: ${SPEECH_MODE:fake}
  storage:
    # 녹음 저장소. local: 이 서버 폴더(FakeObjectStorage, 기본) / ncp: NCP Object Storage(prod 기본)
    mode: ${STORAGE_MODE:local}
    # local 저장소가 녹음 파일을 두는 폴더
    local-dir: ${LOCAL_STORAGE_DIR:${java.io.tmpdir}/council-flow-recordings}
    ncp:
      # 비공개 버킷과 NCP 인증키. 환경변수로만 받고, 비어 있으면 앱은 뜨되 녹음 업로드·전사만 막는다.
      endpoint: ${OBJECT_STORAGE_ENDPOINT:https://kr.object.ncloudstorage.com}
      region: kr-standard
      bucket: ${OBJECT_STORAGE_BUCKET:}
      access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
      secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
      upload-url-ttl: 15m
      call-timeout: 30s
  clova:
    quota:
      enabled: true
      scope: main-HCX-007-test
      requests-per-minute: 60
      tokens-per-minute: 60000
      budget-ratio: 0.9
      max-wait: 30m
    studio:
      # 키는 환경변수로만 받는다. 비어 있으면 분석 작업이 AI_KEY_MISSING 으로 실패한다.
      api-key: ${CLOVA_STUDIO_API_KEY:}
      model: HCX-007
      connect-timeout: 5s
      read-timeout: 240s
      max-completion-tokens: 8192
    speech:
      # 키와 주소는 환경변수로만 받는다. 비어 있으면 전사 작업이 SPEECH_KEY_MISSING 으로 실패한다.
      invoke-url: ${CLOVA_SPEECH_INVOKE_URL:}
      secret-key: ${CLOVA_SPEECH_SECRET_KEY:}
      connect-timeout: 10s
      read-timeout: 180s
  analysis:
    # 회의록이 이보다 길면 발언 ID를 유지한 채 구간으로 나눠 분석하고 합친다.
    chunk-chars: 12000

logging:
  # 모든 로그 줄에 requestId(API)와 jobId(작업)를 붙인다. 회의 원문·키는 로그에 남기지 않는다.
  pattern:
    level: "%5p [rid:%X{requestId:-} job:%X{jobId:-}]"
